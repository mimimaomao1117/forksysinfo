<text x="720" y="695" font-family="Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle" fill="#181818">libnetsys.so</text>
<text x="720" y="725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">I/O / logging / validation</text>
<rect x="1050" y="672" width="315" height="62" fill="white" stroke="#252525" stroke-width="2"/>
<text x="1207.5" y="710" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#181818">Server executable</text>
<line x1="359" y1="703" x2="545" y2="703" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1041" y1="703" x2="895" y2="703" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<text x="452" y="687" font-family="Consolas, monospace" font-size="19" font-weight="400" text-anchor="middle" fill="#181818">DT_NEEDED</text>
<text x="968" y="687" font-family="Consolas, monospace" font-size="19" font-weight="400" text-anchor="middle" fill="#181818">DT_NEEDED</text>
<text x="35" y="785" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#181818">ELF dynamic linking: the same .so file is mapped separately in each process.</text>
</svg>