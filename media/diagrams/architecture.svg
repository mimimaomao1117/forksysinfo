<text x="705" y="431" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#181818">Child process 12</text>
<text x="705" y="460" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Closes listening socket</text>
<line x1="302" y1="447" x2="532" y2="447" stroke="#252525" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="417" y="427" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#181818">Connection 12</text>
<line x1="940" y1="443" x2="879" y2="443" stroke="#252525" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="165" y="384" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#181818">...</text>
<text x="705" y="384" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#181818">...</text>
<rect x="1010" y="150" width="330" height="220" fill="white" stroke="#252525" stroke-width="2"/>
<text x="1175" y="184" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#181818">Parent process</text>
<text x="1175" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">listen() / accept() / fork()</text>
<text x="1175" y="253" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Closes accepted socket</text>
<text x="1175" y="286" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Keeps listening socket</text>
<text x="1175" y="319" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Reaps completed children</text>
<text x="1175" y="349" font-family="Consolas, monospace" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">waitpid(..., WNOHANG)</text>
<line x1="1010" y1="242" x2="940" y2="242" stroke="#252525" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="940" y1="193" x2="940" y2="443" stroke="#252525" stroke-width="2" stroke-dasharray="8 6"/>
<text x="936" y="166" font-family="Consolas, monospace" font-size="19" font-weight="400" text-anchor="middle" fill="#181818">fork()</text>
<text x="515" y="524" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#181818">Each child serves one connected socket in its own process.</text>
<text x="35" y="584" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#181818">Solid arrows: TCP data after accept() and fork().   Dashed arrows: child creation.</text>
<line x1="35" y1="612" x2="1365" y2="612" stroke="#252525" stroke-width="1"/>
<text x="35" y="649" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#181818">Shared utility library</text>
<rect x="35" y="672" width="315" height="62" fill="white" stroke="#252525" stroke-width="2"/>
<text x="192.5" y="710" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#181818">Client executable</text>
