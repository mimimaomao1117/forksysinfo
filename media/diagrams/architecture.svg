<text x="515" y="116" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#181818">Linux server</text>
<text x="35" y="116" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#181818">C clients</text>
<text x="350" y="137" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#181818">TCP sockets</text>
