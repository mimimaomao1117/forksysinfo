<text x="705" y="181" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#181818">Child process 1</text>
<text x="705" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Closes listening socket</text>
