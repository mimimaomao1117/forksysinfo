<text x="417" y="177" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#181818">Connection 1</text>
<line x1="940" y1="193" x2="879" y2="193" stroke="#252525" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="35" y="275" width="260" height="85" fill="white" stroke="#252525" stroke-width="2"/>
<text x="165" y="308" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#181818">C client 2</text>
<text x="165" y="339" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">request / response</text>
<rect x="540" y="275" width="330" height="85" fill="white" stroke="#252525" stroke-width="2"/>
<text x="705" y="306" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#181818">Child process 2</text>
<text x="705" y="335" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Closes listening socket</text>
<line x1="302" y1="322" x2="532" y2="322" stroke="#252525" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="417" y="302" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#181818">Connection 2</text>
<line x1="940" y1="318" x2="879" y2="318" stroke="#252525" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
