<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-label="ForkSysInfo frame layout and receive flow">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#252525"/></marker></defs>
<rect width="1400" height="740" fill="white"/>
<text x="35" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#181818">Length-prefixed application protocol</text>
<text x="35" y="88" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#181818">Frame layout</text>
<rect x="35" y="110" width="430" height="110" fill="#f5f5f5" stroke="#252525" stroke-width="2"/>
<rect x="465" y="110" width="900" height="110" fill="white" stroke="#252525" stroke-width="2"/>
<text x="250" y="148" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#181818">4-byte unsigned length</text>
<text x="250" y="181" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#181818">network byte order</text>
<text x="250" y="207" font-family="Consolas, monospace" font-size="23" font-weight="400" text-anchor="middle" fill="#181818">00 00 00 04</text>
<text x="915" y="148" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#181818">Payload: 1 to 4096 bytes</text>
<text x="915" y="185" font-family="Consolas, monospace" font-size="25" font-weight="400" text-anchor="middle" fill="#181818">50 49 4e 47  =  PING</text>
<text x="35" y="259" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#181818">Example request: 8 bytes total. The length value counts payload bytes only.</text>
<text x="35" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#181818">Processing one request</text>
<rect x="35" y="345" width="220" height="95" fill="white" stroke="#252525" stroke-width="2"/>
<text x="145" y="381" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#181818">Receive header</text>
<text x="145" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">exactly 4 bytes</text>
<rect x="312.5" y="345" width="220" height="95" fill="white" stroke="#252525" stroke-width="2"/>
<text x="422.5" y="381" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#181818">Validate length</text>
<text x="422.5" y="414" font-family="Consolas, monospace" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">1 &lt;= n &lt;= 4096</text>
<rect x="590" y="345" width="220" height="95" fill="white" stroke="#252525" stroke-width="2"/>
<text x="700" y="381" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#181818">Receive payload</text>
<text x="700" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">exactly n bytes</text>
<rect x="867.5" y="345" width="220" height="95" fill="white" stroke="#252525" stroke-width="2"/>
<text x="977.5" y="381" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#181818">Handle command</text>
<text x="977.5" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">SYSINFO / PING / ...</text>
<rect x="1145" y="345" width="220" height="95" fill="white" stroke="#252525" stroke-width="2"/>
<text x="1255" y="381" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#181818">Send response</text>
<text x="1255" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">same frame format</text>
<line x1="261" y1="392" x2="304.5" y2="392" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="538.5" y1="392" x2="582" y2="392" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="816" y1="392" x2="859.5" y2="392" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1093.5" y1="392" x2="1137" y2="392" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<text x="563" y="373" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#181818">valid</text>
<line x1="422.5" y1="446" x2="422.5" y2="512" stroke="#252525" stroke-width="2" marker-end="url(#arrow)"/>
<text x="439" y="483" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#181818">invalid</text>
<rect x="312.5" y="520" width="220" height="82" fill="white" stroke="#252525" stroke-width="2"/>
<text x="422.5" y="553" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#181818">Reject the frame</text>
<text x="422.5" y="584" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#181818">Close connection</text>
<text x="625" y="541" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#181818">Receive and send loops handle:</text>
<text x="625" y="576" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#181818">partial I/O, EINTR, EOF and deadlines.</text>
<line x1="35" y1="636" x2="1365" y2="636" stroke="#252525" stroke-width="1"/>
<text x="35" y="674" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#181818">TCP is a byte stream. One frame may span segments; several frames may arrive together.</text>
<text x="35" y="710" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#181818">Requests and responses use the same format. Fixed-size buffers keep memory bounded.</text>
</svg>